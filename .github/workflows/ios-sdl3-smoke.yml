name: iOS native host build

on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-sdl3-smoke.yml'

permissions:
  contents: read

jobs:
  ios-device-build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out port repository
        uses: actions/checkout@v4

      - name: Check out SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.2.x
          path: third_party/SDL3

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Configure native iOS app
        run: |
          cmake -S ios -B build/ios-device -G Xcode \
            -DSDL_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/SDL3" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Build unsigned iOS app
        run: cmake --build build/ios-device --config Release --target ShaolinMonksIOS

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ShaolinMonksIOS-unsigned-app
          path: build/ios-device/Release-iphoneos/ShaolinMonksIOS.app
          if-no-files-found: error
